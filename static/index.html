<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orbit CRM</title><script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{ink:'#152238',sky:'#38bdf8',mint:'#2dd4bf'}}}}</script></head>
<body class="bg-slate-50 text-ink min-h-screen"><main class="max-w-7xl mx-auto p-5 md:p-10">
<header class="flex flex-wrap justify-between items-center gap-4 mb-10"><div><p class="text-sky font-semibold tracking-widest text-xs uppercase">Sales workspace</p><h1 class="text-3xl font-bold">Orbit CRM</h1><p class="text-slate-500 mt-1">A clear view of your customer momentum.</p></div><div class="flex gap-3"><button onclick="openModal('deal')" class="px-4 py-2 rounded-xl bg-ink text-white font-medium">+ New deal</button><button onclick="openModal('contact')" class="px-4 py-2 rounded-xl bg-sky text-ink font-medium">+ Contact</button></div></header>
<section id="metrics" class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8"></section>
<section class="grid lg:grid-cols-3 gap-6"><div class="lg:col-span-2 space-y-6"><div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100"><div class="flex justify-between items-center mb-4"><h2 class="font-bold text-lg">Pipeline</h2><span class="text-xs text-slate-400">Click a deal stage to update</span></div><div id="pipeline" class="grid md:grid-cols-5 gap-3"></div></div><div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden"><div class="p-5 flex justify-between"><h2 class="font-bold text-lg">Contacts</h2><input id="search" oninput="renderContacts()" placeholder="Search contacts" class="border rounded-lg px-3 py-1 text-sm w-44"></div><div class="overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-50 text-slate-500 text-left"><tr><th class="p-4">Person</th><th class="p-4">Company</th><th class="p-4">Status</th><th class="p-4">Email</th></tr></thead><tbody id="contacts"></tbody></table></div></div></div>
<aside class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100"><h2 class="font-bold text-lg mb-5">Recent activity</h2><div id="activity" class="space-y-5"></div></aside></section><section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 mt-6"><div class="flex justify-between items-center mb-4"><div><p class="text-sky font-semibold tracking-widest text-xs uppercase">Approval queue</p><h2 class="font-bold text-lg">Agent follow-up drafts</h2></div><span class="text-xs text-slate-500">Drafts only — this app never sends email</span></div><div id="followups" class="grid md:grid-cols-2 gap-4"></div></section></main>
<div id="modal" class="hidden fixed inset-0 bg-slate-950/40 p-4 items-center justify-center"><div class="bg-white w-full max-w-md rounded-2xl p-6"><div class="flex justify-between mb-5"><h2 id="modalTitle" class="font-bold text-xl"></h2><button onclick="closeModal()">✕</button></div><form id="form" class="space-y-3"></form></div></div>
<script>
let data={contacts:[],deals:[],activities:[],metrics:{pipeline:{}}}; const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n||0); const esc=s=>String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function load(){const r=await fetch('/api/dashboard');data=await r.json();render();loadFollowUps()};
function render(){const m=data.metrics;document.querySelector('#metrics').innerHTML=[['Contacts',m.contact_count,'sky'],['Open pipeline',money(m.open_pipeline),'mint'],['Closed won',money(m.won_value),'emerald'],['Deals',data.deals.length,'violet']].map(x=>`<div class="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm"><p class="text-sm text-slate-500">${x[0]}</p><p class="text-2xl font-bold mt-1 text-${x[2]}-500">${x[1]}</p></div>`).join('');renderPipeline();renderContacts();document.querySelector('#activity').innerHTML=data.activities.map(a=>`<div class="border-l-2 border-sky pl-3"><p class="text-sm font-medium">${esc(a.subject)}</p><p class="text-xs text-slate-500">${esc(a.contacts?.name||'Unknown')} · ${new Date(a.occurred_at).toLocaleDateString()}</p></div>`).join('')||'<p class="text-slate-400">No activity yet.</p>'}
function renderPipeline(){const stages=['lead','qualified','proposal','negotiation','won'];document.querySelector('#pipeline').innerHTML=stages.map(s=>`<div class="bg-slate-50 rounded-xl p-3 min-h-32"><div class="flex justify-between text-xs uppercase font-bold text-slate-500 mb-3"><span>${s}</span><span>${money(data.metrics.pipeline[s])}</span></div>${data.deals.filter(d=>d.stage===s).map(d=>`<button onclick="advance('${d.id}','${s}')" class="text-left w-full bg-white p-2 rounded-lg shadow-sm text-sm mb-2 hover:ring-2 ring-sky"><b>${esc(d.name)}</b><br><span class="text-slate-500">${money(d.value)}</span></button>`).join('')||'<p class="text-xs text-slate-400">No deals</p>'}</div>`).join('')}
function renderContacts(){const q=document.querySelector('#search').value.toLowerCase();document.querySelector('#contacts').innerHTML=data.contacts.filter(c=>Object.values(c).join(' ').toLowerCase().includes(q)).map(c=>`<tr class="border-t border-slate-100"><td class="p-4 font-medium">${esc(c.name)}<div class="text-slate-400 text-xs">${esc(c.title||'')}</div></td><td class="p-4">${esc(c.company||'—')}</td><td class="p-4"><span class="rounded-full bg-sky-50 text-sky-700 px-2 py-1 text-xs">${esc(c.status)}</span></td><td class="p-4 text-slate-500">${esc(c.email)}</td></tr>`).join('')}
async function advance(id,stage){const stages=['lead','qualified','proposal','negotiation','won'];const next=stages[Math.min(stages.indexOf(stage)+1,stages.length-1)];await fetch('/api/deals/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({stage:next})});load()}
function openModal(type){document.querySelector('#modal').classList.replace('hidden','flex');const f=document.querySelector('#form');if(type==='contact'){modalTitle.textContent='Add contact';f.innerHTML=`<input name="name" required placeholder="Full name" class="input"><input name="email" required type="email" placeholder="Email" class="input"><input name="company" placeholder="Company" class="input"><input name="title" placeholder="Job title" class="input"><button class="submit">Save contact</button>`;f.onsubmit=e=>save(e,'contacts')}else{modalTitle.textContent='Add deal';f.innerHTML=`<input name="name" required placeholder="Deal name" class="input"><select name="contact_id" required class="input"><option value="">Choose contact</option>${data.contacts.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><input name="value" type="number" placeholder="Value" class="input"><select name="stage" class="input"><option>lead</option><option>qualified</option><option>proposal</option><option>negotiation</option></select><button class="submit">Save deal</button>`;f.onsubmit=e=>save(e,'deals')}document.querySelectorAll('.input').forEach(x=>x.className='w-full border border-slate-200 rounded-lg px-3 py-2');document.querySelector('.submit').className='w-full bg-ink text-white rounded-lg py-2 font-medium'}
function closeModal(){modal.classList.replace('flex','hidden')} async function save(e,path){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});closeModal();load()}load();
async function loadFollowUps(){const r=await fetch('/api/follow-ups');const drafts=await r.json();document.querySelector('#followups').innerHTML=drafts.length?drafts.map(d=>`<article class="border border-slate-200 rounded-xl p-4"><div class="flex justify-between gap-3"><div><p class="font-bold">${esc(d.contacts?.name)}</p><p class="text-xs text-slate-500">${esc(d.deals?.name)} · ${esc(d.rationale)}</p></div><span class="capitalize text-xs h-fit rounded-full px-2 py-1 ${d.status==='pending'?'bg-amber-100 text-amber-800':'bg-slate-100 text-slate-600'}">${esc(d.status)}</span></div><p class="font-medium text-sm mt-3">${esc(d.subject)}</p><p class="text-sm text-slate-600 whitespace-pre-line mt-1">${esc(d.body)}</p><p class="text-xs mt-3 text-slate-500"><b>Suggested next action:</b> ${esc(d.suggested_next_action)}</p>${d.status==='pending'?`<div class="flex gap-2 mt-4"><button onclick="reviewDraft('${d.id}','approved')" class="text-sm px-3 py-1.5 rounded-lg bg-emerald-600 text-white">Approve</button><button onclick="reviewDraft('${d.id}','rejected')" class="text-sm px-3 py-1.5 rounded-lg bg-slate-200">Reject</button></div>`:''}</article>`).join(''):'<p class="text-slate-400 text-sm">No drafts awaiting review. The morning agent will add only stalled opportunities.</p>'}
async function reviewDraft(id,decision){await fetch('/api/follow-ups/'+id+'/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision})});loadFollowUps()}
</script></body></html>
